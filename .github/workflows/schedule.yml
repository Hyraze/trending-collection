name: GitHub-Trending

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

# Only one archive run at a time — concurrent runs would race on the same commit.
concurrency:
  group: trending-archive
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Run scraper
        run: python gitreposcraper.py

      - name: Commit and push
        run: |
          git config user.name "hanishrao"
          git config user.email "hanishrao321@gmail.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "$(date '+%Y-%m-%d')"
          git push
